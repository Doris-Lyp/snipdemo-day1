name: Build and push image

on:
  push:
    branches:
      - main
    paths:
      - bundle
      - .github/workflows/docker.yml
  workflow_run:
    workflows:
      - Build bundle
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and all submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Check for a new bundle release
        id: release
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          BUNDLE_WORKFLOW_BASE: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$WORKFLOW_EVENT" != "workflow_run" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if git diff --quiet "$BUNDLE_WORKFLOW_BASE" origin/main -- bundle; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.release.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frontend dependencies
        if: steps.release.outputs.changed == 'true'
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        if: steps.release.outputs.changed == 'true'
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Test frontend
        if: steps.release.outputs.changed == 'true'
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Build frontend
        if: steps.release.outputs.changed == 'true'
        working-directory: frontend
        run: npm run build
      - name: Test CLI
        if: steps.release.outputs.changed == 'true'
        working-directory: cli
        run: node --test cli.test.js
      - name: Set up Bun
        if: steps.release.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
      - name: Smoke-test API and CLI
        if: steps.release.outputs.changed == 'true'
        working-directory: backend
        run: |
          set -euo pipefail
          PORT=3000 bun run server.js > /tmp/snip-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/links >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/snip-api.log
            exit 1
          fi
          short_url=$(SNIP_API=http://127.0.0.1:3000 node ../cli/cli.js add https://example.com/)
          code=${short_url##*/}
          [[ "$code" =~ ^[A-Za-z0-9]{6}$ ]]
          SNIP_API=http://127.0.0.1:3000 node ../cli/cli.js ls | grep -F 'https://example.com/'
          status=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/$code")
          [ "$status" = 302 ]
          hits=$(curl -fsS http://127.0.0.1:3000/api/links | node -pe "JSON.parse(require('node:fs').readFileSync(0, 'utf8'))[0].hits")
          [ "$hits" = 1 ]
      - name: Normalize image name
        if: steps.release.outputs.changed == 'true'
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        if: steps.release.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Generate image tags
        if: steps.release.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build image for scanning
        if: steps.release.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          file: ./bundle/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
      - name: Scan image for high and critical vulnerabilities
        if: steps.release.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified image tags
        if: steps.release.outputs.changed == 'true'
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          candidate="${IMAGE_NAME}:scan-${GITHUB_SHA}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$candidate" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
