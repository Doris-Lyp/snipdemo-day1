name: Build bundle

on:
  push:
    branches:
      - main
    paths:
      - backend
      - frontend
      - cli
      - scripts/build-bundle.mjs
      - .github/workflows/bundle.yml
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and its submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Only main pushes trigger this workflow; component branch pushes do not.
      - name: Rebuild and push bundle
        run: node scripts/build-bundle.mjs --push
